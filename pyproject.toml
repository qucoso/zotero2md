[project]
name = "zotero2md"
version = "0.1.0"
description = "Incremental Zotero-to-Obsidian sync — exports annotated papers as Markdown with YAML frontmatter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["zotero", "obsidian", "markdown", "sync", "academic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdownify>=1.2.2",
    "rich>=14.2.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Repository = "https://github.com/qucoso/zotero2md"


[project.scripts]
zotero2md = "zotero2md.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero2md"]

[tool.ruff]
line-length = 100
target-version = "py312"